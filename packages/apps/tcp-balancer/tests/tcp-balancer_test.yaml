suite: tcp-balancer default render
templates:
  - templates/deployment.yaml
  - templates/configmap.yaml

release:
  name: tcp-balancer-test
  namespace: tenant-test

tests:
  - it: starts two HAProxy replicas by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - isNotEmpty:
          path: spec.template.spec.containers[?(@.name=="haproxy")].image

  - it: rolls out the requested replica count
    template: templates/deployment.yaml
    set:
      replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
